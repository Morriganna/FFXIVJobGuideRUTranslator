name: Release

# Срабатывает на пуш тега вида v0.1.1, либо запускается вручную (Actions -> Release -> Run
# workflow) с вводом номера версии - тогда тег создаёт и пушит сам. Обычные пуши в main его не
# трогают, тестовые сборки собирает отдельный workflow (test-build.yml) сам по себе.
# AssemblyVersion берётся из самого тега (-p:Version=... при сборке), а не из <Version> в
# csproj - бампать её вручную перед релизом не нужно, достаточно запушить/ввести новый тег.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Тег релиза, например v0.1.2 (обязательно с 'v' в начале)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # При ручном запуске тега ещё нет - берём версию из ввода и создаём тег сами.
      # При пуше тега берём то, что реально запушили (github.ref_name).
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if [[ ! "$TAG" =~ ^v ]]; then
            echo "Тег должен начинаться с 'v' (например v0.1.2), получено: '$TAG'" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Версия сборки = тег без ведущей 'v' (v0.1.2 -> 0.1.2), передаётся как -p:Version=...
          # при сборке ниже - так AssemblyVersion в манифесте всегда совпадает с тегом релиза.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag (manual run only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "Тег ${{ steps.tag.outputs.tag }} уже существует - использую как есть."
          else
            git tag "${{ steps.tag.outputs.tag }}"
            git push origin "${{ steps.tag.outputs.tag }}"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # .NET 10 - требует KamiToolKit 2.2.39 (net10.0-windows7.0), см. csproj.
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: packages.lock.json

      - name: Setup Dalamud
        uses: Blooym/setup-dalamud@v1
        with:
          branch: release

      - name: Restore
        run: dotnet restore FFXIVJobGuideRUTranslator.csproj --locked-mode

      - name: Build
        run: >
          dotnet build FFXIVJobGuideRUTranslator.csproj
          -c Release --no-restore
          -p:Version=${{ steps.tag.outputs.version }}

      - name: Locate DalamudPackager output
        id: pkg
        shell: pwsh
        run: |
          $dir = "bin/Release/FFXIVJobGuideRUTranslator"
          if (-not (Test-Path "$dir/latest.zip")) {
            throw "latest.zip не найден в $dir - похоже, DalamudPackager не отработал (MakeZip)."
          }
          if (-not (Test-Path "$dir/FFXIVJobGuideRUTranslator.json")) {
            throw "Манифест FFXIVJobGuideRUTranslator.json не найден в $dir."
          }
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.pkg.outputs.dir }}/latest.zip

      # repo.json (pluginmaster) для кастомного репозитория Dalamud:
      # https://dalamud.dev/plugin-publishing/custom-repositories/
      # Живёт на main (тег может указывать на другой коммит), поэтому сначала переключаемся
      # туда и уже там читаем/пишем файл - заодно можно сохранить поля тестового канала
      # (Testing*), которые сюда пишет отдельный test-build.yml и которые этот релиз трогать не должен.
      - name: Publish repo.json to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main

          $manifest = Get-Content "${{ steps.pkg.outputs.dir }}/FFXIVJobGuideRUTranslator.json" -Raw | ConvertFrom-Json
          $zipUrl = "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/latest.zip"

          $manifest | Add-Member -NotePropertyName DownloadLinkInstall -NotePropertyValue $zipUrl -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkUpdate -NotePropertyValue $zipUrl -Force
          $manifest | Add-Member -NotePropertyName IsHide -NotePropertyValue $false -Force
          $manifest | Add-Member -NotePropertyName IsTestingExclusive -NotePropertyValue $false -Force
          $manifest | Add-Member -NotePropertyName LastUpdate -NotePropertyValue ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()) -Force

          # Если на main уже лежит repo.json с тестовым каналом (от test-build.yml) - переносим
          # эти поля на новую запись как есть, стабильный релиз их не меняет и не затирает.
          if (Test-Path "repo.json") {
            $existing = (Get-Content "repo.json" -Raw | ConvertFrom-Json)[0]
            foreach ($field in @("TestingAssemblyVersion", "DownloadLinkTesting", "TestingDalamudApiLevel")) {
              if ($existing.PSObject.Properties.Name -contains $field) {
                $manifest | Add-Member -NotePropertyName $field -NotePropertyValue $existing.$field -Force
              }
            }
          }

          # Dalamud ждёт именно JSON-массив "[{...}]", даже если плагин в репозитории один.
          # @($manifest) заворачивает объект в массив из одного элемента; передаём его через
          # -InputObject (не через конвейер!) - конвейер PowerShell разворачивает массивы
          # обратно в отдельные объекты, и ConvertTo-Json тогда увидит голый объект, а не массив.
          ConvertTo-Json -InputObject @($manifest) -Depth 10 | Set-Content -Path "repo.json" -Encoding utf8

          git add repo.json
          $status = git status --porcelain
          if ($status) {
            # [skip ci] - иначе этот коммит на main сам запустит test-build.yml (он триггерится
            # на любой пуш в main) и мы соберём тестовую сборку без единой реальной правки кода.
            git commit -m "chore: update repo.json for ${{ steps.tag.outputs.tag }} [skip ci]"
            git push origin HEAD:main
          } else {
            Write-Host "repo.json не изменился, коммит не нужен."
          }
