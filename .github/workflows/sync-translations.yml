name: Sync translations

# Обновляет FFXIVJobGuideRUTranslator/Data/SourceJson/ свежими DB/*.json из основного
# репозитория перевода (Murakumo-JP/FFXIVJobGuideRU) и коммитит изменения в main.
# Только вручную - "/jgru update" в игре тянет то же самое, но в папку конфига игрока,
# а не в гит, так что вшитый в сборку бандл сам по себе не обновляется без этого workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_OWNER: Murakumo-JP
  SOURCE_REPO: FFXIVJobGuideRU
  SOURCE_BRANCH: main
  TARGET_DIR: FFXIVJobGuideRUTranslator/Data/SourceJson

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Логика 1-в-1 повторяет TranslationUpdater.cs (Data/TranslationUpdater.cs):
      # список файлов через git-trees API, фильтр DB/*.json, пропуск Menu.json (навигация сайта).
      - name: Fetch DB/*.json from source repo
        shell: pwsh
        run: |
          $headers = @{ "User-Agent" = "FFXIVJobGuideRUTranslator-Sync-Action" }
          $treeUrl = "https://api.github.com/repos/$env:SOURCE_OWNER/$env:SOURCE_REPO/git/trees/$($env:SOURCE_BRANCH)?recursive=1"
          $tree = Invoke-RestMethod -Uri $treeUrl -Headers $headers

          if ($tree.truncated) {
            Write-Warning "Ответ GitHub API помечен как truncated - часть файлов могла не попасть в список."
          }

          $paths = $tree.tree |
            Where-Object { $_.type -eq "blob" -and $_.path -like "DB/*.json" -and $_.path -notlike "*Menu.json" } |
            ForEach-Object { $_.path }

          if (-not $paths -or $paths.Count -eq 0) {
            throw "Не нашёл ни одного файла DB/*.json в $env:SOURCE_OWNER/$env:SOURCE_REPO - что-то не так, обновление отменено."
          }
          Write-Host "Найдено файлов: $($paths.Count)"

          # Чистим старый бандл целиком, чтобы файлы, удалённые/переименованные в источнике,
          # не остались висеть в репозитории плагина.
          if (Test-Path $env:TARGET_DIR) {
            Remove-Item -Path $env:TARGET_DIR -Recurse -Force
          }
          New-Item -ItemType Directory -Path $env:TARGET_DIR -Force | Out-Null

          $rawBase = "https://raw.githubusercontent.com/$env:SOURCE_OWNER/$env:SOURCE_REPO/$env:SOURCE_BRANCH/"
          foreach ($path in $paths) {
            $relative = $path -replace "^DB/", ""
            $destination = Join-Path $env:TARGET_DIR $relative
            New-Item -ItemType Directory -Path (Split-Path $destination) -Force | Out-Null
            Invoke-WebRequest -Uri ($rawBase + $path) -Headers $headers -OutFile $destination
          }

          Write-Host "Скачано и разложено файлов: $($paths.Count)"

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $env:TARGET_DIR
          $status = git status --porcelain
          if ($status) {
            # [skip ci] - иначе этот коммит на main сам запустит test-build.yml (он триггерится
            # на любой пуш в main).
            git commit -m "chore: sync translations from $env:SOURCE_OWNER/$env:SOURCE_REPO DB/*.json [skip ci]"
            git push origin HEAD:main
          } else {
            Write-Host "Изменений нет - перевод уже актуален."
          }
